<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dustUP</title>
<meta name="description" content="dustUP — a voxel sandboarding bullet-hell bounty hunt through a mythic Egyptian desert." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e0b373'/%3E%3Crect x='4' y='3' width='8' height='7' fill='%23fff6e2'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%239dff3a'/%3E%3Crect x='9' y='5' width='2' height='2' fill='%239dff3a'/%3E%3Crect x='2' y='2' width='12' height='2' fill='%236b3f20'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/src/style.css" />
<style>
  /* the boot cover: dark soul void from the first paint, before any script; the hourglass (LoadingScreen) takes it over */
  html, body { background: #040309; }
  html body #boot { position: fixed; inset: 0; z-index: 50; display: block; overflow: hidden; opacity: 1; transition: opacity .45s ease;
    background:
      radial-gradient(ellipse 34% 40% at 50% 47%, rgba(36, 150, 108, .13), rgba(36, 150, 108, 0) 70%),
      radial-gradient(ellipse 80% 70% at 50% 47%, #17113a 0%, #0b0822 42%, #040309 78%, #020105 100%); }
  html body #boot-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .7s ease; }
  html body #boot-gl.on { opacity: 1; }
  html body #boot-ui { position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%); image-rendering: pixelated; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
